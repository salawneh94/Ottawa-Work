name: Build Revit Plugins

on:
  push:
    paths:
      - "plugins/**"
      - ".github/workflows/build-plugins.yml"
  pull_request:
    paths:
      - "plugins/**"
      - ".github/workflows/build-plugins.yml"
  workflow_dispatch:

jobs:
  build:
    # WinForms (UseWindowsForms) needs the Windows Desktop SDK, which only
    # ships on Windows-hosted runners — this can't build on Linux/macOS.
    runs-on: windows-latest

    # One matrix leg per supported Revit year, each on its own fresh
    # runner/checkout — both years currently target the same TargetFramework
    # (net8.0-windows, see Directory.Build.props) with
    # AppendTargetFrameworkToOutputPath=false, so building both in the same
    # checkout back-to-back would silently overwrite one year's output with
    # the other's instead of erroring. Separate matrix legs sidestep that
    # entirely rather than requiring a clean between builds.
    strategy:
      fail-fast: false
      matrix:
        revit: ["2025", "2026"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Revit API assemblies come from the community-maintained
      # Nice3point.Revit.Api NuGet packages (see plugins/Directory.Build.props)
      # instead of a local Revit install, so this needs no Revit license.
      # RevitVersion has to be passed at restore time too, not just build —
      # it selects which Nice3point.Revit.Api package version gets restored.
      - name: Restore
        run: dotnet restore plugins/OttawaWork.sln -p:RevitVersion=${{ matrix.revit }}

      - name: Build
        run: dotnet build plugins/OttawaWork.sln --no-restore --configuration Debug -p:RevitVersion=${{ matrix.revit }}

      # Flat-folder layout: every plugin's .addin manifest references its
      # own DLL by bare filename, resolved relative to the manifest's own
      # directory — so the manifest and every DLL it needs (including the
      # shared OttawaWork.Shared.dll dependency) have to land in the same
      # folder for Revit to find them. This is a compile-verified build
      # only — it hasn't been run inside Revit, see plugins/README.md.
      - name: Package built add-ins
        if: success()
        shell: pwsh
        run: |
          $dist = "dist/OttawaTools-Addins-${{ matrix.revit }}"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          # Search recursively rather than assuming bin/Debug directly —
          # Platforms/PlatformTarget=x64 in Directory.Build.props can add an
          # extra bin\x64\Debug\ segment MSBuild doesn't document loudly.
          #
          # "*.dll" (not just "OttawaWork.*.dll") on purpose: OttawaWork.Shared
          # pulls in ClosedXML (BrandedXlsx.cs) plus ClosedXML's own runtime
          # dependencies (DocumentFormat.OpenXml[.Framework], ExcelNumberFormat,
          # RBush, SixLabors.Fonts, System.IO.Packaging, ClosedXML.Parser) —
          # those copy-local into every plugin's own bin output alongside
          # OttawaWork.Shared.dll (via CopyLocalLockFileAssemblies on Shared's
          # csproj — see that file's comment for why that flag is the part
          # that actually makes them exist on disk). Filtering to
          # "OttawaWork.*.dll" silently dropped all of them from the shipped
          # add-in folder, so any plugin calling BrandedXlsx would find no
          # ClosedXML.dll at all, or fall back to whatever unrelated
          # same-named DLL happened to already be in the user's shared
          # Addins folder — producing a version-mismatch TypeLoadException
          # instead of a clean "file not found". The Nice3point.Revit.Api
          # packages are ExcludeAssets="runtime", so they never land in
          # bin/ in the first place and this can't re-ship them.
          Get-ChildItem -Path plugins/src -Directory | ForEach-Object {
            $binDir = Join-Path $_.FullName "bin"
            if (Test-Path $binDir) {
              Get-ChildItem -Path $binDir -Filter "*.dll" -Recurse | Copy-Item -Destination $dist -Force
              Get-ChildItem -Path $binDir -Filter "*.addin" -Recurse | Copy-Item -Destination $dist -Force
            }
          }

          # Ribbon icons are embedded resources inside OttawaWork.QuickAccessRibbon.dll
          # itself now (plugins/src/QuickAccessRibbon/Resources/Icons, loaded via
          # pack:// URI by RibbonBuilder.cs) rather than loose files copied
          # alongside every add-in — that DLL is already copied into $dist by
          # the loop above, so there's nothing extra to stage here.

          # Same deal for the branded-export logo (BrandedXlsx.cs loads it
          # from a "Branding" subfolder next to OttawaWork.Shared.dll).
          $brandingDist = Join-Path $dist "Branding"
          New-Item -ItemType Directory -Path $brandingDist -Force | Out-Null
          Copy-Item -Path plugins/src/Shared/Branding/*.png -Destination $brandingDist -Force

          $dllCount = (Get-ChildItem -Path $dist -Filter "*.dll").Count
          $addinCount = (Get-ChildItem -Path $dist -Filter "*.addin").Count
          Write-Host "Packaged $dllCount DLL(s) and $addinCount .addin manifest(s)."

          if ($dllCount -eq 0) {
            Write-Host "No DLLs found — listing plugins/src/ParamPowerSuite/bin for diagnosis:"
            Get-ChildItem -Path "plugins/src/ParamPowerSuite/bin" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          }

          Set-Content -Path "$dist/README.txt" -Value @"
          Ottawa Tools Revit add-ins — Revit ${{ matrix.revit }} build (commit $env:GITHUB_SHA)

          Easiest install: run OttawaTools-Setup-${{ matrix.revit }}.exe (next to this folder
          in the same CI artifact set, or the ottawatools-installer-${{ matrix.revit }}
          artifact) and restart Revit.

          Manual install, if you'd rather not run the installer:
          1. Copy every file in this folder into:
             %AppData%\Autodesk\Revit\Addins\${{ matrix.revit }}\
          2. Restart Revit. All plugins appear under one Ottawa Tools ribbon tab.

          This is a compile-verified build only (CI is green) — none of
          these add-ins have been functionally tested by running them
          inside Revit yet. See plugins/README.md for details.
          "@

      - name: Upload add-ins artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ottawatools-addins-${{ matrix.revit }}
          path: dist/OttawaTools-Addins-${{ matrix.revit }}
          retention-days: 30

      # windows-latest normally ships Inno Setup already, but installing it
      # explicitly (a no-op if it's already there) keeps this from silently
      # breaking if a future runner image drops it.
      - name: Install Inno Setup
        if: success()
        shell: pwsh
        run: choco install --no-progress -y innosetup

      # Packages dist/OttawaTools-Addins-<year> into a single one-click
      # installer (see plugins/installer/OttawaTools.iss) — the
      # "one-installer, many-tools" model the top-level README describes,
      # instead of the manual copy-into-AddIns-folder step README.txt above
      # still documents as a fallback. /DRevitYear selects which year's
      # dist folder, AddIns subfolder, and installer AppId the .iss uses.
      - name: Build installer
        if: success()
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" plugins\installer\OttawaTools.iss "/DRevitYear=${{ matrix.revit }}"

      - name: Upload installer artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ottawatools-installer-${{ matrix.revit }}
          path: dist/OttawaTools-Setup-${{ matrix.revit }}.exe
          retention-days: 30
